name: test

# The suite boots a real coordinator and agents over loopback (CLAUDE.md,
# "Testing conventions"); it needs nothing but Node.
#
# Manual only for now. On 2026-10-04 every job on this account ended within
# three seconds with no runner assigned and no step run, here and in
# vyos88/Alpha: an account-level Actions block (billing or settings), not this
# file. On push and pull_request it would send a failure email for every
# change. Once Actions runs jobs again, restore:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
